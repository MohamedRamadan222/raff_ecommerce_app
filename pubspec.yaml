  name: raff_app
  description: "A Flutter application."
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.13.2

  dependencies:
    flutter:
      sdk: flutter

    flutter_localizations:
      sdk: flutter

    cupertino_icons: ^1.0.8
    flutter_bloc: ^9.1.1
    bloc: ^9.2.1
    equatable: ^3.0.0
    dio: ^5.11.1
    get_it: ^9.3.0
    go_router: ^18.1.3
    gap: ^3.1.0
    flutter_screenutil_plus: ^2.0.0
    intl: ^0.20.3
    shared_preferences: ^2.5.6
    hive_ce: ^2.23.2
    flutter_secure_storage: ^11.2.0
    cached_network_image: ^4.0.6
    flutter_svg: ^2.3.2
    dartz: ^0.10.1

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^6.0.0

  flutter:
    generate: true
    uses-material-design: true

    fonts:
      - family: ReadexPro
        fonts:
          - asset: assets/fonts/readexpro/ReadexPro-ExtraLight.ttf
            weight: 200
          - asset: assets/fonts/readexpro/ReadexPro-Light.ttf
            weight: 300
          - asset: assets/fonts/readexpro/ReadexPro-Regular.ttf
            weight: 400
          - asset: assets/fonts/readexpro/ReadexPro-Medium.ttf
            weight: 500
          - asset: assets/fonts/readexpro/ReadexPro-SemiBold.ttf
            weight: 600
          - asset: assets/fonts/readexpro/ReadexPro-Bold.ttf
            weight: 700

      - family: ReemKufi
        fonts:
          - asset: assets/fonts/reemkufi/ReemKufi-Bold.ttf
            weight: 700